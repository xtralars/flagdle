<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Guess the Flag Game</title>
</head>
<body>
    <div class="game-container">
        <header>
            <h1>Guess the Flag</h1>
        </header>
        <main>
            <div class="stats">
                <span>Score: <strong id="score">0</strong></span>
                <span>Streak: <strong id="streak">0</strong></span>
                <span>Best streak: <strong id="bestStreak">0</strong></span>
            </div>

            <div class="flag-display">
                <!-- tiny transparent gif so there is no broken-image icon before the first flag loads -->
                <img src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="Flag to guess" id="flagImage">
            </div>

            <div class="attempts" id="attemptsDisplay" role="img" aria-label="5 attempts left"></div>

            <div class="input-section">
                <div class="input-wrapper">
                    <input type="text" id="guessInput" placeholder="Enter your guess"
                           autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go"
                           role="combobox" aria-autocomplete="list" aria-controls="suggestions">
                    <ul id="suggestions" class="suggestions-list" role="listbox"></ul>
                </div>
                <div class="button-row">
                    <button id="submitGuess">Guess</button>
                    <button id="hintButton" class="btn-secondary" type="button">Hint</button>
                    <button id="skipButton" class="btn-secondary" type="button">Skip</button>
                </div>
            </div>

            <div class="message" id="messageDisplay" aria-live="polite"></div>
            <button id="nextButton" type="button" hidden>Next flag</button>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
